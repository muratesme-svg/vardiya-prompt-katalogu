name = "vardiya-rating-relay"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true
# Sürüm önizleme adresleri kapalı: yalnızca tek, bilinen adres çalışır.
preview_urls = false

[vars]
REPO = "muratesme-svg/vardiya-prompt-katalogu"
